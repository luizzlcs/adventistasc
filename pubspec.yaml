name: adventistasc
description: "Igreja Adventista do 7º Dia."
publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: '>=3.4.4 <4.0.0'


dependencies:
  flutter:
    sdk: flutter

  
  cupertino_icons: ^1.0.6
  url_launcher: ^6.3.1
  clipboard: ^0.1.3
  share_plus: ^10.1.4
  googleapis: ^11.0.0
  gsheets: ^0.5.0
  googleapis_auth: ^1.4.0
  shared_preferences: ^2.1.0
  favicon: ^1.1.2
  flutter_native_splash: ^2.4.1
  flutter_dotenv: ^5.2.1
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  get_it: ^8.0.3
  

flutter_native_splash:
  color: "#D9D9D9"  # Cor de fundo
  image: "assets/images/splash.png"  # Caminho da imagem
  android_12:
    image: assets/images/splash.png
    color: "#D9D9D9"
    android: true
    ios: true
    web: true




dev_dependencies:
  flutter_test:
    sdk: flutter

  
  flutter_lints: ^3.0.0

